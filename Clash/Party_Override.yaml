# Clash Party / MihomoParty 覆写文件（防 DNS/WebRTC 泄露优化版）

ipv6: false
mode: rule

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  use-system-hosts: false
  respect-rules: true

  fake-ip-filter:
    - geosite:private
    - geosite:category-ntp
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
    "geosite:private":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true
  dns-hijack:
    - any:53

proxy-groups:
  - {name: 节点选择, type: select, proxies: [自动选择, 全球节点, 香港节点, 美国节点, 狮城节点, 日本节点, 台湾节点, DIRECT], icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png}
  - {name: 自动选择, type: url-test, include-all: true, interval: 600, tolerance: 50, icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png}
