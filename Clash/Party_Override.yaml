# Clash Party / Mihomo Party 覆写文件
# 说明：
# - 仅整理格式与分组结构，尽量不改现有逻辑
# - 重点优化可读性、注释层次与后续维护体验

# ==================================================
# 基础设置
# ==================================================
ipv6: false
mode: rule

# ==================================================
# DNS 配置
# ==================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  use-system-hosts: false
  respect-rules: true

  fake-ip-filter:
    - geosite:private
    - geosite:category-ntp
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
    "geosite:private":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query

# ==================================================
# TUN 配置
# ==================================================
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true
  dns-hijack:
    - any:53

# ==================================================
# 策略组
# ==================================================
proxy-groups:
  # ----------------------------
  # 主策略组
  # ----------------------------
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 全球节点
