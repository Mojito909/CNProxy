# Clash Party / MihomoParty 覆写文件
# 该配置为完全符合 Clash/Mihomo 架构的规则配置覆写文件

# ==========================================
# DNS 防泄露与分流配置 (Clash Meta 标准)
# ==========================================
dns:
  enable: true
  prefer-h3: true        # 优先使用 HTTP/3 加速 DoH 查询
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '*'
    - '+.lan'
    - '+.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    # 游戏及 STUN 防代理特征过滤
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    - '*.n.n.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    - 'WORKGROUP'
  # 用于解析 nameserver/fallback 中的 DoH/DoT 域名本身
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 国内域名 DNS（nameserver 仅走国内）
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 境外域名 DNS —— 核心防泄露配置
  # 当 nameserver 返回非中国 IP 时，自动改用 fallback 的结果
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true           # 非 CN IP 触发 fallback
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4       # 保留地址段视为污染，触发 fallback
  # 基于 geosite 的精确分流（优先级高于 fallback-filter）
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://dns.cloudflare.com/dns-query
      - tls://1.1.1.1
      - tls://1.0.0.1

