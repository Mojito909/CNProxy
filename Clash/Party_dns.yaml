# ==================================================
# Mihomo Party / Clash Verge Rev 覆写文件
# 目标:
# 1. 优先解决 DNS 泄露
# 2. 保留 AI 常用分流
# 3. 减少界面复杂度，降低排障变量
#
# 导入后仍需在客户端确认:
# - TUN 已开启
# - Strict Route 已开启
# - DNS Override / DNS 覆写 已关闭
# ==================================================

# ------------------------------
# 锚点: 策略组模板
# ------------------------------
GroupSelect: &GroupSelect
  type: select

GroupAuto: &GroupAuto
  type: url-test
  include-all: true
  interval: 600
  tolerance: 50

# ------------------------------
# 锚点: 节点筛选规则
# ------------------------------
FilterHK: &FilterHK "港|HK|(?i)Hong"
FilterJP: &FilterJP "日|东京|JP|(?i)Japan"
FilterUS: &FilterUS "美|US|(?i)States|American"
FilterTW: &FilterTW "台|湾|TW|(?i)Taiwan"
FilterSG: &FilterSG "新|坡|SG|(?i)Singapore"

# ------------------------------
# 锚点: 规则集模板
# ------------------------------
RuleDomain: &RuleDomain
  type: http
  behavior: domain
  format: mrs
  interval: 86400

RuleIP: &RuleIP
  type: http
  behavior: ipcidr
  format: mrs
  interval: 86400

# ==================================================
# 基础设置
# ==================================================
ipv6: false
mode: rule
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

# ==================================================
# 嗅探配置
# 作用:
# - 提高纯 IP 连接的域名识别率
# - 让规则分流与 DNS 映射更稳定
# ==================================================
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 443
      override-destination: false
    TLS:
      ports:
        - 443
  skip-domain:
    - +.push.apple.com

# ==================================================
# DNS 配置
# 核心目标: fake-ip + respect-rules + 分离直连/代理 DNS
# ==================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  use-system-hosts: false
  respect-rules: true

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - localhost.work.weixin.qq.com
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - geosite:private
    - geosite:category-ntp
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"

  default-nameserver:
    - 223.5.5.5
    - 1.2.4.8

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false

  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://9.9.9.9/dns-query
    - https://77.88.8.8/dns-query

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
    "geosite:private":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query

# ==================================================
# TUN 配置
# 核心目标: 接管系统流量，阻止 DNS 旁路
# ==================================================
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true
  dns-hijack:
    - any:53

# ==================================================
# 策略组
# ==================================================
