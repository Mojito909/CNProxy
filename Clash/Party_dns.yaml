# ==================================================
# 分流规则
# ==================================================
rules:
  # ----------------------------
  # 特殊规则
  # ----------------------------
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN)))),REJECT

  # ----------------------------
  # 广告 / 拦截
  # ----------------------------
  - RULE-SET,Tracking,广告过滤
  - RULE-SET,Advertising,广告过滤
  - RULE-SET,BanAD,广告过滤
  - RULE-SET,AppleUpdate,广告过滤

  # ----------------------------
  # 直连白名单
  # ----------------------------
  - RULE-SET,LocalAreaNetwork,全球直连
  - RULE-SET,UnBan,全球直连
  - RULE-SET,AppleCN,全球直连
  - RULE-SET,China,全球直连
  - DOMAIN-SUFFIX,bing.cn,全球直连
  - DOMAIN-SUFFIX,cn.bing.com,全球直连

  # ----------------------------
  # 服务分流
  # ----------------------------
  - RULE-SET,AI,人工智能
  - RULE-SET,Google,谷歌服务
  - RULE-SET,YouTube,油管视频
  - RULE-SET,Bing,微软Bing
  - RULE-SET,OneDrive,微软服务
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Apple,苹果服务
  - RULE-SET,Telegram,电报消息
  - RULE-SET,Streaming,国外媒体
  - RULE-SET,Proxy,节点选择

  # ----------------------------
  # IP 分流
  # ----------------------------
  - RULE-SET,AdvertisingIP,广告过滤,no-resolve
  - RULE-SET,AIIP,人工智能,no-resolve
  - RULE-SET,TelegramIP,电报消息,no-resolve
  - RULE-SET,StreamingIP,国外媒体,no-resolve
  - RULE-SET,GoogleIP,谷歌服务,no-resolve
  - RULE-SET,ProxyIP,节点选择,no-resolve
  - RULE-SET,ChinaIP,全球直连,no-resolve

  # ----------------------------
  # 末尾兜底
  # ----------------------------
  - GEOIP,LAN,全球直连
  - GEOIP,CN,全球直连
  - MATCH,漏网之鱼
